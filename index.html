<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aria — the AI that gets the task done</title>
  <meta name="description" content="A free AI assistant that reads your files and gets the task done. No sign-up, no API keys, no tracking." />
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23161616'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://js.puter.com/v2/" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Aria home">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <circle cx="16" cy="16" r="9" stroke="currentColor" stroke-width="2" />
            <circle cx="16" cy="16" r="3" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>Aria</strong>
          <small>gets it done</small>
        </span>
      </a>
      <button id="newChat" class="ghost" type="button" title="Start a new conversation">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        New chat
      </button>
    </header>

    <main id="chat" class="chat">
      <section id="welcome" class="welcome">
        <h2>What needs doing?</h2>
        <p>Hand me the task — a file to read, a plan to build, a script to fix. I'll do the work, not just talk about it.</p>
        <div class="chips" role="list">
          <button class="chip" type="button" role="listitem">Read the file I'm attaching and pull out the key points</button>
          <button class="chip" type="button" role="listitem">Turn my notes into a proper report</button>
          <button class="chip" type="button" role="listitem">Fix this script and tell me what broke</button>
          <button class="chip" type="button" role="listitem">Make a plan I can actually follow</button>
        </div>
      </section>

      <div id="messages" class="messages" aria-live="polite" aria-label="Conversation"></div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <div id="attachments" class="attachments" hidden></div>
      <div class="field" id="field">
        <button id="attach" class="attach" type="button" aria-label="Attach a file" title="Attach any file">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 11.5 12.2 19.8a5.1 5.1 0 0 1-7.2-7.2l8.3-8.3a3.4 3.4 0 0 1 4.8 4.8l-8.3 8.3a1.7 1.7 0 0 1-2.4-2.4l7.6-7.6" />
          </svg>
        </button>
        <input id="fileInput" type="file" multiple hidden />
        <label class="sr-only" for="input">Message Aria</label>
        <textarea
          id="input"
          rows="1"
          placeholder="Give me a task…"
          enterkeyhint="send"
          spellcheck="true"
        ></textarea>
        <button id="send" class="send" type="submit" aria-label="Send message" disabled>
          <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
      </div>
      <p class="hint">
        <span>Attach any file with the paperclip · Enter to send</span>
        <span class="privacy">Files are read here, never uploaded</span>
      </p>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>

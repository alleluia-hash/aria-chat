<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aria — a simple everyday AI</title>
  <meta name="description" content="A free, minimalist AI assistant for everyday questions. No sign-up, no API keys, no tracking." />
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23161616'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://js.puter.com/v2/" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Aria home">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <circle cx="16" cy="16" r="9" stroke="currentColor" stroke-width="2" />
            <circle cx="16" cy="16" r="3" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>Aria</strong>
          <small>everyday AI</small>
        </span>
      </a>
      <button id="newChat" class="ghost" type="button" title="Start a new conversation">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        New chat
      </button>
    </header>

    <main id="chat" class="chat">
      <section id="welcome" class="welcome">
        <h2>What can I help with?</h2>
        <p>Ask me anything — a quick answer, a plan, some writing, or a thing you're stuck on.</p>
        <div class="chips" role="list">
          <button class="chip" type="button" role="listitem">Plan a cheap weekend in Rome</button>
          <button class="chip" type="button" role="listitem">Turn these notes into an email</button>
          <button class="chip" type="button" role="listitem">Dinner with what's in my fridge</button>
          <button class="chip" type="button" role="listitem">Explain credit scores simply</button>
        </div>
      </section>

      <div id="messages" class="messages" aria-live="polite" aria-label="Conversation"></div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <div class="field" id="field">
        <label class="sr-only" for="input">Message Aria</label>
        <textarea
          id="input"
          rows="1"
          placeholder="Ask anything…"
          enterkeyhint="send"
          spellcheck="true"
        ></textarea>
        <button id="send" class="send" type="submit" aria-label="Send message" disabled>
          <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7" />
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
      </div>
      <p class="hint">
        <span>Enter to send · Shift + Enter for a new line</span>
        <span class="privacy">Chats stay in this browser</span>
      </p>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>

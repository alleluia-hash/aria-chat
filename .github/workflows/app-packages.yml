name: app packages

# Builds the Android and Windows packages from source and attaches them to the
# release named after package/VERSION (v1.0.1, v1.0.2, ...). Bump that file
# when you want a new version; every push rebuilds the downloads.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/app-packages.yml"

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip

      - name: Windows launcher
        run: |
          mkdir -p package/out
          x86_64-w64-mingw32-gcc -O2 -s -Wl,--subsystem,windows \
            package/windows/launcher.c -o package/out/Aria.exe -luser32 -lshell32
          file package/out/Aria.exe

      - name: Android app
        run: bash package/android/build-apk.sh

      - name: Assemble downloads
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist/windows
          cp package/out/Aria.exe dist/windows/
          cp index.html app.js styles.css dist/windows/
          cp package/windows/READ-ME.txt dist/windows/
          cp package/WHAT-IS-IN-HERE.txt dist/
          cp package/out/Aria.apk dist/
          ( cd dist/windows && zip -q -9 -X ../Aria-Windows.zip Aria.exe index.html app.js styles.css READ-ME.txt )
          mkdir -p bundle && cp dist/Aria.apk dist/Aria-Windows.zip package/WHAT-IS-IN-HERE.txt bundle/
          ( cd bundle && zip -q -9 -X ../dist/Aria-app-packages.zip Aria.apk Aria-Windows.zip WHAT-IS-IN-HERE.txt )
          ls -lh dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \t\r\n' < package/VERSION)"
          TAG="v$VERSION"
          echo "Publishing $TAG from $GITHUB_SHA"
          NOTES="$(printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
            "Aria $VERSION for Android and Windows." \
            "- Aria.apk - the Android app. Tap it on the phone to install." \
            "- Aria-Windows.zip - unzip it, then double-click Aria.exe." \
            "- Aria-app-packages.zip - both of the above in one download." \
            "iPhone: there is no .ipa. Open https://alleluia-hash.github.io/aria-chat/ in Safari, then Share -> Add to Home Screen.")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::$TAG already exists, so its downloads were rebuilt. Bump package/VERSION for a new version."
          else
            gh release create "$TAG" --title "Aria $VERSION" --target "$GITHUB_SHA" --notes "$NOTES"
          fi
          cd dist
          gh release upload "$TAG" Aria.apk Aria-Windows.zip Aria-app-packages.zip --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: aria-app-packages
          path: dist/*.zip
